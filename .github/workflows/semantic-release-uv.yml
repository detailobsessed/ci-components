name: Semantic Release (Python/UV)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version (must match your project's requires-python)"
        required: true
        type: string
      runner:
        description: "GitHub Actions runner"
        required: false
        default: "blacksmith-4vcpu-ubuntu-2404"
        type: string
      dependency-group:
        description: "UV dependency group containing python-semantic-release"
        required: false
        default: "maintain"
        type: string
    outputs:
      released:
        description: "Whether a new release was created"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: "The released version (e.g. 1.2.3)"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The release tag (e.g. v1.2.3)"
        value: ${{ jobs.release.outputs.tag }}

jobs:
  release:
    name: Release
    runs-on: ${{ inputs.runner }}
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          # Required: without this, setup-uv resolves the latest version via
          # anonymous GitHub API calls which get rate-limited on shared runners.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        env:
          DEP_GROUP: ${{ inputs.dependency-group }}
        run: uv sync --no-default-groups --group "$DEP_GROUP"

      - name: Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          uv run semantic-release --strict version --changelog --push --tag --vcs-release
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            tag=$(git describe --tags --abbrev=0)
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          elif [ $exit_code -eq 2 ]; then
            echo "No release needed"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Semantic release failed with exit code $exit_code"
            exit $exit_code
          fi
