name: NPM Publish (Bun)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version (24+ required for OIDC trusted publishing)"
        required: false
        default: "24"
        type: string
      bun-version:
        description: "Bun version"
        required: false
        default: "latest"
        type: string
      build-command:
        description: "Build command to run before publish"
        required: false
        default: "bun run build"
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Publish to npm
        # Uses OIDC trusted publishing - no NPM_TOKEN needed
        # Provenance is automatically generated for public repos/packages
        run: npm publish --access public
